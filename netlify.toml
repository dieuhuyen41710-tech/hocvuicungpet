[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# Forward /api/chat requests to Netlify serverless function
[[redirects]]
  from = "/api/chat/*"
  to = "/.netlify/functions/chat"
  status = 200

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

# Single Page Application SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
